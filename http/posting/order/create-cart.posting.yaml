name: create-cart
description: |-
  POST /api/cart  (Bearer — owner is the authenticated customer)
  Opens a new active cart. Response is CartView; capture @cartId.
method: POST
url: $ENV_BASE_URL/cart
body:
  content: |-
    {
      "currency": "USD"
    }
headers:
- name: Authorization
  value: Bearer $accessToken
- name: Content-Type
  value: application/json
scripts:
  on_response: order/scripts.py:capture_create_cart
