name: place-order-different-body
description: |-
  POST /api/cart/:cartId/place  (Bearer + owner-check)
  The REUSE-WITH-A-DIFFERENT-BODY error: the SAME @placeKey but a CHANGED body (a different
  shipping recipient). The stored fingerprint no longer matches, so the request is rejected
  WITHOUT executing:
    422 { statusCode: 422, code: "ORDER_IDEMPOTENCY_KEY_REUSED" }
  (a client bug — one key reused for two distinct requests — surfaced rather than silently
  honored with the wrong cached response).
method: POST
url: $ENV_BASE_URL/cart/$cartId/place
body:
  content: |-
    {
      "shippingAddress": {
        "recipientName": "Someone Else",
        "line1": "500 Howard St",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US"
      },
      "billingAddress": {
        "recipientName": "Someone Else",
        "line1": "500 Howard St",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US"
      },
      "paymentMethod": "tok_visa"
    }
headers:
- name: Authorization
  value: Bearer $accessToken
- name: Idempotency-Key
  value: $placeKey
- name: Content-Type
  value: application/json
scripts:
  setup: order/scripts.py:setup_place_order_different_body
