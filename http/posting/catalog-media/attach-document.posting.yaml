name: attach-document
description: |-
  POST /api/catalog/media  (Bearer — catalog:write)
  A third asset on product 1 — the last slot. The three now form the strip in
  creation order (image, video, document).
method: POST
url: $ENV_BASE_URL/catalog/media
body:
  content: |-
    {
      "ownerType": "product",
      "ownerId": 1,
      "uri": "https://cdn.example.com/workshop/lamp-manual.pdf",
      "type": "document"
    }
headers:
- name: Authorization
  value: Bearer $accessToken
- name: Content-Type
  value: application/json
scripts:
  on_response: catalog-media/scripts.py:capture_attach_document
