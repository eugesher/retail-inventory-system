name: publish-product
description: |-
  POST /api/catalog/products/:productId/publish  (Bearer — catalog:publish)
  Transitions the product draft -> active. Two HARD preconditions gate it: the
  domain requires >= 1 variant, and the use case requires an in-effect
  DEFAULT_CURRENCY price on EVERY variant (ADR-026) — hence the two set-price
  requests above. Returns 200 (a state transition, not a creation) with ProductView
  { ..., status: 'active', publishedAt }. catalog:publish is a higher-trust code
  than catalog:write — a role may hold write without publish.

  The response also carries warnings[] with CATALOG_PRODUCT_PUBLISH_NO_ACTIVE_MEDIA,
  because no media asset was attached. That is a SOFT recommendation (ADR-029 §7),
  checked after the save and unable to block: the publish still returns 200.
method: POST
url: $ENV_BASE_URL/catalog/products/$productId/publish
headers:
- name: Authorization
  value: Bearer $accessToken
