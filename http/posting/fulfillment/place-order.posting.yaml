name: place-order
description: |-
  POST /api/cart/:cartId/place  (Bearer + owner-check)
  Converts the cart into an Order, allocates the stock holds, and authorizes payment
  inline. Response (201) is OrderView with status='pending', paymentStatus='authorized',
  fulfillmentStatus='unfulfilled', and a lines[] array. Capture @orderId plus each
  line's id + ordered quantity so the fulfillment can reference them.
method: POST
url: $ENV_BASE_URL/cart/$cartId/place
body:
  content: |-
    {
      "shippingAddress": {
        "recipientName": "Jane Buyer",
        "line1": "1 Market St",
        "line2": "Suite 400",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US",
        "phone": "+1-415-555-0100"
      },
      "billingAddress": {
        "recipientName": "Jane Buyer",
        "line1": "1 Market St",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US"
      },
      "paymentMethod": "tok_visa"
    }
headers:
- name: Authorization
  value: Bearer $customerToken
- name: Idempotency-Key
  value: $place_order_guid
- name: Content-Type
  value: application/json
scripts:
  setup: fulfillment/scripts.py:setup_place_order
  on_response: fulfillment/scripts.py:capture_place_order
