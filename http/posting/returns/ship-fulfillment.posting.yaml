name: ship-fulfillment
description: |-
  POST /api/orders/:orderId/fulfillments/:fulfillmentId/ship  (Bearer — order:fulfill)
  Ships the fulfillment (captures the authorized payment inline). The order's
  fulfillmentStatus becomes `shipped`.
method: POST
url: $ENV_BASE_URL/orders/$orderId/fulfillments/$fulfillmentId/ship
body:
  content: |-
    {
      "trackingNumber": "1Z999AA10123456790",
      "carrier": "UPS"
    }
headers:
- name: Authorization
  value: Bearer $accessToken
- name: Idempotency-Key
  value: $ship_fulfillment_guid
- name: Content-Type
  value: application/json
scripts:
  setup: returns/scripts.py:setup_ship_fulfillment
