name: login-staff
description: |-
  POST /api/auth/staff/login
  Seeded admin login (order:capture + order:cancel + order:refund + order:read).
method: POST
url: $ENV_BASE_URL/auth/staff/login
body:
  content: |-
    {
      "email": "admin@example.com",
      "password": "admin1234"
    }
headers:
- name: Content-Type
  value: application/json
scripts:
  on_response: refunds/scripts.py:capture_login_staff
