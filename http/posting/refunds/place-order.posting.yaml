name: place-order
description: |-
  POST /api/cart/:cartId/place  (Bearer + owner-check)
  Places the order (authorize-only). Response (201) is OrderView; capture @orderId.
method: POST
url: $ENV_BASE_URL/cart/$cartId/place
body:
  content: |-
    {
      "shippingAddress": {
        "recipientName": "Jane Buyer",
        "line1": "1 Market St",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US"
      },
      "billingAddress": {
        "recipientName": "Jane Buyer",
        "line1": "1 Market St",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US"
      },
      "paymentMethod": "tok_visa"
    }
headers:
- name: Authorization
  value: Bearer $customerToken
- name: Idempotency-Key
  value: $place_order_guid
- name: Content-Type
  value: application/json
scripts:
  setup: refunds/scripts.py:setup_place_order
  on_response: refunds/scripts.py:capture_place_order
