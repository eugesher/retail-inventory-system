name: issue-refund-different-body
description: |-
  POST /api/orders/:orderId/refunds  (Bearer — staff order:refund)
  The REUSE-WITH-A-DIFFERENT-BODY error: the SAME @refundKey but a CHANGED amountMinor
  (2000 instead of 1000). The stored fingerprint no longer matches, so the request is
  rejected WITHOUT executing:
    422 { statusCode: 422, code: "ORDER_IDEMPOTENCY_KEY_REUSED" }
  The 422 fires before any gateway call, so no over-refund can slip through this reuse.
method: POST
url: $ENV_BASE_URL/orders/$orderId/refunds
body:
  content: |-
    {
      "paymentId": $paymentId,
      "amountMinor": 2000,
      "reason": "Goodwill price adjustment"
    }
headers:
- name: Authorization
  value: Bearer $accessToken
- name: Idempotency-Key
  value: $refundKey
- name: Content-Type
  value: application/json
scripts:
  setup: refunds/scripts.py:setup_issue_refund_different_body
