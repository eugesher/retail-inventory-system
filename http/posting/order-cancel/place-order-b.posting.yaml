name: place-order-b
description: |-
  POST /api/cart/:cartId/place  (Bearer + owner-check)
  Places the order. Capture @orderIdB + the single line's id.
method: POST
url: $ENV_BASE_URL/cart/$cartIdB/place
body:
  content: |-
    {
      "shippingAddress": {
        "recipientName": "Jane Buyer",
        "line1": "1 Market St",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US"
      },
      "billingAddress": {
        "recipientName": "Jane Buyer",
        "line1": "1 Market St",
        "city": "San Francisco",
        "region": "CA",
        "postalCode": "94105",
        "country": "US"
      }
    }
headers:
- name: Authorization
  value: Bearer $customerToken
- name: Idempotency-Key
  value: $place_order_b_guid
- name: Content-Type
  value: application/json
scripts:
  setup: order-cancel/scripts.py:setup_place_order_b
  on_response: order-cancel/scripts.py:capture_place_order_b
