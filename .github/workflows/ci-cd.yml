name: CI / CD

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Lint
        run: yarn lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Build
        run: yarn build

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: unit

    env:
      DATABASE_URL: mysql://retail:retailpass@localhost:3306/retail_db
      EVENTSTORE_DATABASE_URL: mysql://retail:retailpass@localhost:3306/ris_eventstore
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: warn
      API_GATEWAY_PORT: 3000
      JWT_ACCESS_SECRET: development-access-secret-do-not-use-in-prod-32chars
      JWT_REFRESH_SECRET: development-refresh-secret-do-not-use-in-prod-32chars
      OTEL_SERVICE_NAME: api-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318/v1/traces

    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: retail_db
          MYSQL_USER: retail
          MYSQL_PASSWORD: retailpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:4.2.3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8.6.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Create event-store database
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < scripts/mysql-init/01-create-eventstore-db.sql

      - name: Run migrations
        run: yarn migration:run

      - name: Run event-store migrations
        run: yarn migration:run:eventstore

      - name: Seed database
        run: yarn test:seed

      - name: Run E2E tests
        run: yarn test:e2e:run
