name: CI / CD

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    # Today this job runs `yarn lint` only. A later step in the architecture
    # migration adds a sibling `yarn lint:architecture` step that enforces
    # the hexagonal layer rules (domain → application → infrastructure /
    # presentation) via `eslint-plugin-boundaries`. The plugin is already
    # installed (see ADR-004) but intentionally not wired into
    # eslint.config.mjs until services have reached the target shape.
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: 'yarn'

      - name: Install Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: 'yarn'

      - name: Install Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

  unit:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: 'yarn'

      - name: Install Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test:unit

  e2e:
    runs-on: ubuntu-latest
    needs: unit

    env:
      DATABASE_URL: mysql://retail:retailpass@localhost:3306/retail_db
      # The event store persists to an ISOLATED logical database `ris_eventstore`
      # (ADR-034) — a separate schema on the same MySQL instance. Only the event-store
      # microservice opens it, but it is a required config key for every service, so it
      # is set here (parity with `DATABASE_URL`) for the in-process e2e boots.
      EVENTSTORE_DATABASE_URL: mysql://retail:retailpass@localhost:3306/ris_eventstore
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      REDIS_URL: redis://localhost:6379
      LOG_LEVEL: warn

    services:
      mysql:
        image: mysql:8.4.8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: retail_db
          MYSQL_USER: retail
          MYSQL_PASSWORD: retailpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:4.2.3-management
        env:
          RABBITMQ_DEFAULT_USER: guest
          RABBITMQ_DEFAULT_PASS: guest
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8.6.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=3s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
          cache: 'yarn'

      - name: Install Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # The MySQL service container auto-creates only `retail_db` (its `MYSQL_DATABASE`).
      # The event store's isolated `ris_eventstore` schema (ADR-034) — provisioned
      # locally by the docker-compose init mount, which GitHub service containers can't
      # use — is created here by piping the SAME init SQL (one source of truth) to the
      # client as root, so the `retail` user gains it just like on a fresh docker volume.
      - name: Create event-store database
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < scripts/mysql-init/01-create-eventstore-db.sql

      - name: Run migrations
        run: yarn migration:run

      # Apply the event-store schema's OWN migration history (ADR-034) — the second
      # family `test:infra:reload` runs locally. Without it the firehose tables are
      # absent and the event-store microservice boot fails.
      - name: Run event-store migrations
        run: yarn migration:run:eventstore

      - name: Seed database
        run: yarn test:seed

      - name: Run E2E tests
        run: yarn test:e2e:run
