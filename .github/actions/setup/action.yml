name: Set up Node and install dependencies
description: >-
  Node from .nvmrc, Yarn through corepack, and an immutable workspace install. Shared by every job
  so the toolchain cannot differ between them.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: yarn

    - name: Install Yarn
      run: corepack enable
      shell: bash

    - name: Install dependencies
      run: yarn install --immutable
      shell: bash
